apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gameapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/SnakeGame.git
    targetRevision: main
    path: gitops/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: gameapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true